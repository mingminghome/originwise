<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#111111" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="OriginWise" />
    <meta name="application-name" content="OriginWise" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>OriginWise — Quick China-related product check</title>
    <meta
      name="description"
      content="Fast check: is this product or brand China-related? Type a name or photo the package. History stays on your device. AI can be wrong — not legal advice."
    />
    <meta
      name="robots"
      content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1"
    />
    <meta name="author" content="OriginWise" />
    <meta
      name="keywords"
      content="China-related product check, brand origin checker, made in China, supply chain, product origin, OriginWise"
    />
    <link rel="canonical" href="https://originwise.pages.dev/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="OriginWise" />
    <meta
      property="og:title"
      content="OriginWise — Quick China-related product check"
    />
    <meta
      property="og:description"
      content="Fast check: is this product or brand China-related? Type a name or photo the package. History stays on your device."
    />
    <meta property="og:url" content="https://originwise.pages.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="zh_Hant" />
    <meta
      property="og:image"
      content="https://originwise.pages.dev/og.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="OriginWise — Quick China-related product check"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="OriginWise — Quick China-related product check"
    />
    <meta
      name="twitter:description"
      content="Fast check: is this product or brand China-related? History stays on your device. AI can be wrong — not legal advice."
    />
    <meta
      name="twitter:image"
      content="https://originwise.pages.dev/og.png"
    />
    <meta
      name="twitter:image:alt"
      content="OriginWise — Quick China-related product check"
    />

    <!-- GOOGLE_SITE_VERIFICATION -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "OriginWise",
        "alternateName": "OriginWise China-related product check",
        "applicationCategory": "UtilitiesApplication",
        "operatingSystem": "Web",
        "browserRequirements": "Requires JavaScript",
        "url": "https://originwise.pages.dev/",
        "description": "OriginWise is a local-first checker for whether a product or brand is China-related. Type a name or photo the package. History stays on the device. AI estimates can be wrong — not legal advice.",
        "inLanguage": ["en", "zh-Hant"],
        "isAccessibleForFree": true,
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "featureList": [
          "Text or photo product/brand check",
          "China-related tier scoring",
          "On-device history",
          "Multi-model AI pool with synthesised result"
        ],
        "privacyPolicy": "https://originwise.pages.dev/privacy.html",
        "termsOfService": "https://originwise.pages.dev/terms.html"
      }
    </script>
    <!-- GTM is injected at runtime from VITE_GTM_ID (see src/core/analytics/gtm.ts) -->
    <style>
      #ow-static-home {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Noto Sans TC',
          sans-serif;
        max-width: 40rem;
        margin: 0 auto;
        padding: 2rem 1.25rem 3rem;
        color: #111111;
        line-height: 1.65;
        background: #f2f2f2;
        min-height: 100vh;
        box-sizing: border-box;
      }
      #ow-static-home h1 {
        font-size: 1.75rem;
        margin: 0 0 0.75rem;
      }
      #ow-static-home .muted {
        color: #6b6b6b;
      }
      html.ow-app-ready #ow-static-home {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="ow-static-home">
      <h1>OriginWise</h1>
      <p>
        <strong>OriginWise</strong> — quick check: is this product or brand
        China-related? Type a name or photo the package.
      </p>
      <p class="muted">
        Loading the full app… Enable JavaScript if nothing appears.
      </p>
      <p class="muted">
        AI can be wrong. Not legal advice. History stays on your device.
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
